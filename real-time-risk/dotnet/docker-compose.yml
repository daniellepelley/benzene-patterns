name: benzene-patterns-real-time-risk

# The Real-Time Risk & Trading Platform (docs/patterns/reference-real-time-risk.md): Trade Ledger,
# Risk Read Models, Pricing Service, and the Risk Coordinator/Worker map-reduce pair - running
# entirely locally, no cloud account required.
#
# The Pricing Service speaks gRPC (h2c) rather than HTTP, and has server reflection on, so grpcurl
# needs no .proto file to drive it.
#
#   docker compose up --build
#   curl -X POST http://localhost:8081/trades -H 'content-type: application/json' \
#     -d '{"book":"desk-a","symbol":"AAPL","side":"Buy","quantity":100,"price":150.25}'
#   curl http://localhost:8082/books/desk-a/positions
#   grpcurl -plaintext -d '{"symbol":"AAPL"}' localhost:8083 pricing.Pricing/GetPrice
#   curl -X POST http://localhost:8084/risk/runs -H 'content-type: application/json' \
#     -d '{"books":["desk-a"]}'
#
# The official AWS "DynamoDB Local" image (amazon/dynamodb-local) provides the table + stream -
# genuinely free, no account/token needed (unlike LocalStack, whose community and pro images merged
# in 2026: localstack/localstack:latest now requires signing up for a LocalStack account and an auth
# token even for community-tier services, which would have quietly broken the "no cloud account"
# promise here). Both application services build from the repo root's real-time-risk/dotnet folder
# (they're ordinary NuGet consumers, so unlike benzene-dotnet's own example compose files there's no
# need for a wider build context reaching into another repo).
#
# DynamoDB Local has no bundled table-provisioning tool and no HTTP health endpoint to gate on, so
# there's no dedicated init container here: TradeLedger creates the "trades" table itself at startup
# (idempotently, with retries - see StartUp.cs), and RiskReadModels' TradeStreamProjector already
# polls/retries until that table (and its stream) exists.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"

  trade-ledger:
    build:
      context: .
      dockerfile: TradeLedger/Dockerfile
    image: benzene-patterns-trade-ledger:compose
    environment:
      - DYNAMODB_SERVICE_URL=http://dynamodb-local:8000
      - TRADES_TABLE_NAME=trades
    ports:
      - "8081:8080"
    depends_on:
      - dynamodb-local

  # The only service here with no cloud dependency at all - no DynamoDB, nothing to provision, no
  # stream to poll - so it has no depends_on and is the one you can run on its own.
  pricing:
    build:
      context: .
      dockerfile: PricingService/Dockerfile
    image: benzene-patterns-pricing:compose
    ports:
      - "8083:8080"

  # The map-reduce pair (docs/patterns/reference-real-time-risk.md §4). The worker is deliberately
  # replica-scaled rather than singular: `docker compose up --scale risk-worker=4` is the local form
  # of "a burst of stateless workers", and Compose's DNS round-robins risk-worker across them, so the
  # coordinator's single routed URL fans out without knowing how many there are.
  risk-worker:
    build:
      context: .
      dockerfile: RiskWorker/Dockerfile
    image: benzene-patterns-risk-worker:compose
    environment:
      - READ_MODELS_URL=http://risk-read-models:8080
      - PRICING_URL=http://pricing:8080
    # No ports: this is a private worker on the Compose network, not an edge service. The
    # BenzeneMessage endpoint it serves is documented as opt-in and not for unauthenticated public
    # exposure, and that is respected here rather than worked around.
    depends_on:
      - risk-read-models
      - pricing

  risk-coordinator:
    build:
      context: .
      dockerfile: RiskCoordinator/Dockerfile
    image: benzene-patterns-risk-coordinator:compose
    environment:
      - RISK_WORKER_URL=http://risk-worker:8080/benzene-message
    ports:
      - "8084:8080"
    depends_on:
      - risk-worker

  risk-read-models:
    build:
      context: .
      dockerfile: RiskReadModels/Dockerfile
    image: benzene-patterns-risk-read-models:compose
    environment:
      - DYNAMODB_SERVICE_URL=http://dynamodb-local:8000
      - TRADES_TABLE_NAME=trades
    ports:
      - "8082:8080"
    depends_on:
      - dynamodb-local

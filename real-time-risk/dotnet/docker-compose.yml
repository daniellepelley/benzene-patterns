name: benzene-patterns-real-time-risk

# The Real-Time Risk & Trading Platform (docs/patterns/reference-real-time-risk.md), Trade Ledger +
# Risk Read Models slice, running entirely locally - no cloud account required.
#
#   docker compose up --build
#   curl -X POST http://localhost:8081/trades -H 'content-type: application/json' \
#     -d '{"book":"desk-a","symbol":"AAPL","side":"Buy","quantity":100,"price":150.25}'
#   curl http://localhost:8082/books/desk-a/positions
#
# LocalStack emulates DynamoDB + DynamoDB Streams; both application services build from the repo
# root's real-time-risk/dotnet folder (they're ordinary NuGet consumers, so unlike benzene-dotnet's
# own example compose files there's no need for a wider build context reaching into another repo).
services:
  localstack:
    image: localstack/localstack:latest
    environment:
      - SERVICES=dynamodb,dynamodbstreams
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  trade-ledger:
    build:
      context: .
      dockerfile: TradeLedger/Dockerfile
    image: benzene-patterns-trade-ledger:compose
    environment:
      - DYNAMODB_SERVICE_URL=http://localstack:4566
      - TRADES_TABLE_NAME=trades
    ports:
      - "8081:8080"
    depends_on:
      localstack:
        condition: service_healthy

  risk-read-models:
    build:
      context: .
      dockerfile: RiskReadModels/Dockerfile
    image: benzene-patterns-risk-read-models:compose
    environment:
      - DYNAMODB_SERVICE_URL=http://localstack:4566
      - TRADES_TABLE_NAME=trades
    ports:
      - "8082:8080"
    depends_on:
      localstack:
        condition: service_healthy

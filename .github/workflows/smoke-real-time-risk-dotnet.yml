name: Smoke - Real-Time Risk (.NET)

# End-to-end smoke test for the .NET Trade Ledger + Risk Read Models + Market-Data Aggregator +
# Valuation Service slice: build the images, `docker compose up`, book a trade, assert the read model
# reflects it, then assert the synthetic tick feed rolls into a bar and the bar produces a valuation.
# Fully self-contained (DynamoDB Local + a single-node Apache Kafka in KRaft mode; no cloud
# credentials, no account, no signup).
on:
  push:
    branches: [ "main" ]
    paths:
      - 'real-time-risk/dotnet/**'
      - '.github/workflows/smoke-real-time-risk-dotnet.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'real-time-risk/dotnet/**'
      - '.github/workflows/smoke-real-time-risk-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: real-time-risk/dotnet/docker-compose.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ####################################################################################
      # TEMPORARY - DELETE THIS WHOLE STEP when benzene-dotnet PR #17 merges and
      # Benzene.Kafka.Streaming is published to nuget.org. See real-time-risk/dotnet/nuget.config.
      #
      # MarketDataAggregator depends on that package, which is real, reviewed code on an unmerged
      # branch and does not exist on nuget.org, so it is built from source into the repo-relative
      # folder feed the Dockerfiles' build context picks up. Everything else - including the
      # Benzene.Kafka.Core this package depends on - still restores from the real 0.0.2-alpha.4
      # release.
      # ####################################################################################
      - name: Setup .NET (only to pack the unreleased Kafka streaming binding)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack the unreleased Benzene.Kafka.Streaming into the local folder feed
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/daniellepelley/Benzene.git /tmp/benzene-dotnet
          git -C /tmp/benzene-dotnet checkout claude/kafka-stream-binding
          dotnet pack /tmp/benzene-dotnet/src/Benzene.Kafka.Streaming/Benzene.Kafka.Streaming.csproj \
            -c Release -p:PackageVersion=0.0.2-alpha.4 \
            -o "$GITHUB_WORKSPACE/real-time-risk/dotnet/local-packages"
          # The symbols package would be restored as a duplicate id; the feed only wants the .nupkg.
          rm -f "$GITHUB_WORKSPACE/real-time-risk/dotnet/local-packages"/*.snupkg
          ls -la "$GITHUB_WORKSPACE/real-time-risk/dotnet/local-packages"

      - name: Unit tests (the OHLC roll-up logic)
        # Pure logic, no broker: worth failing fast on before spending minutes on images.
        run: dotnet test real-time-risk/dotnet/MarketDataAggregator.Tests/Benzene.Patterns.RealTimeRisk.MarketDataAggregator.Tests.csproj

      - name: Compose up (build)
        run: docker compose -f "$COMPOSE_FILE" up -d --build

      - name: Wait for the HTTP services to accept requests
        # "Up" here just means curl gets any HTTP response instead of connection-refused (status
        # "000") - none of the services has a dedicated health endpoint yet, and TradeLedger has no
        # GET route at all (only POST /trades), so a 4xx/5xx still proves the app is listening.
        # market-data-aggregator and tick-generator have no HTTP surface at all; the bar assertion
        # below is what proves they are alive.
        run: |
          for url in http://localhost:8081/trades \
                     http://localhost:8082/books/warmup/positions \
                     http://localhost:8083/valuations/by-symbol/WARMUP; do
            ok=0
            for i in $(seq 1 45); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$status" != "000" ]; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url never came up"
              exit 1
            fi
          done

      - name: Book a trade
        run: |
          curl -fsS -X POST http://localhost:8081/trades \
            -H 'content-type: application/json' \
            -d '{"book":"smoke-test","symbol":"AAPL","side":"Buy","quantity":100,"price":150.25}' \
            -o book-trade-response.json
          echo "--- book-trade-response.json ---"; cat book-trade-response.json
          # A plain [HttpEndpoint] response body is the handler's raw JSON payload (camelCase) - no
          # BenzeneMessage envelope wrapper; the Benzene status maps onto the HTTP status instead.
          jq -e '.version == 1' book-trade-response.json >/dev/null \
            || { echo "::error::expected the first trade on a fresh book to be version 1"; exit 1; }

      # The projection is eventually consistent (DynamoDB Streams -> the background poller), so poll
      # until it catches up rather than asserting on the first read. 90 attempts (~3 minutes) rather
      # than the original 30 (~1 minute): a real run showed the projector's own stream-discovery loop
      # (TradeStreamProjector.WaitForStreamArnAsync, 2s interval) plus its first GetRecords poll can
      # take close to a minute on a loaded CI runner even though every step it's built from is fast in
      # isolation - the projection landed correctly (right trade, right version) just a few seconds
      # after the old 60s budget ran out, so this was headroom, not a logic bug.
      - name: Assert the read model reflects the booked trade
        run: |
          ok=0
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8082/books/smoke-test/positions -o positions.json
            projected=$(jq -r '.projectedThroughVersion' positions.json)
            echo "attempt $i: projectedThroughVersion=$projected"
            if [ "$projected" = "1" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::read model never projected the booked trade"
            cat positions.json
            exit 1
          fi
          echo "--- positions.json ---"; cat positions.json
          jq -e '.positions[] | select(.symbol == "AAPL" and .netQuantity == 100)' positions.json >/dev/null \
            || { echo "::error::expected a 100-share AAPL position"; exit 1; }

      - name: Assert the by-symbol read path sees the same position
        # The read the Valuation Service depends on. Same projection, second query - so if the
        # previous step passed and this one doesn't, the bug is in QueryBySymbol, not the projector.
        run: |
          curl -fsS http://localhost:8082/positions/by-symbol/AAPL -o by-symbol.json
          echo "--- by-symbol.json ---"; cat by-symbol.json
          jq -e '.books[] | select(.book == "smoke-test" and .netQuantity == 100)' by-symbol.json >/dev/null \
            || { echo "::error::expected the smoke-test book to show up under AAPL"; exit 1; }

      - name: Assert a bar closed and produced a valuation
        # The whole new hop in one assertion: the tick generator is producing AAPL ticks, the
        # aggregator must roll them into a 10s bar (BAR_INTERVAL_SECONDS in docker-compose.yml) and
        # publish bar-closed, and the Valuation Service must react by marking the smoke-test book's
        # 100 AAPL shares. Up to ~3 minutes, matching the read-model budget above: this waits on the
        # read-model projection *and* a bar boundary *and* two Kafka consumer groups forming.
        run: |
          ok=0
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8083/valuations/by-symbol/AAPL -o valuations.json
            mark=$(jq -r '.markPrice' valuations.json)
            books=$(jq -r '[.valuations[] | select(.book == "smoke-test")] | length' valuations.json)
            echo "attempt $i: markPrice=$mark smoke-test rows=$books"
            if [ "$books" = "1" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::no valuation for the smoke-test book ever appeared"
            cat valuations.json
            exit 1
          fi
          echo "--- valuations.json ---"; cat valuations.json
          # markPrice must be a real mark that came off a bar, not the empty-store default...
          jq -e '.markPrice > 0' valuations.json >/dev/null \
            || { echo "::error::expected a non-zero mark price from a closed bar"; exit 1; }
          # ...and marketValue must be netQuantity x markPrice. Compared with a tolerance, not for
          # equality: the service computes in decimal, jq reads JSON numbers as doubles, and
          # 100 * 149.34 is not exactly 14934 in binary floating point.
          jq -e '(.valuations[] | select(.book == "smoke-test")) as $row
                 | ($row.marketValue - ($row.netQuantity * .markPrice)) as $diff
                 | $row.netQuantity == 100 and $diff < 0.01 and $diff > -0.01' valuations.json >/dev/null \
            || { echo "::error::marketValue is not netQuantity x markPrice"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        # No --tail limit, and one service at a time: risk-read-models alone emits 2 log lines per
        # /positions poll (up to 90 of them), which was drowning out TradeStreamProjector's own
        # startup/lifecycle lines under a shared --tail=200 - the exact lines needed to diagnose a
        # failed projection were being truncated away before they ever reached this step's output.
        run: |
          docker compose -f "$COMPOSE_FILE" ps -a || true
          for service in dynamodb-local kafka kafka-init trade-ledger risk-read-models \
                         tick-generator market-data-aggregator valuation-service; do
            echo "::group::$service full logs"
            docker compose -f "$COMPOSE_FILE" logs "$service" || true
            echo "::endgroup::"
          done
          echo "::group::risk-read-models TradeStreamProjector lines only"
          # -A 1: the .NET console logger puts the category on one line ("info: ...TradeStreamProjector[0]")
          # and the actual message on the next, indented line - without -A 1 this only ever showed the
          # category, never the message that explains what happened.
          docker compose -f "$COMPOSE_FILE" logs risk-read-models 2>&1 \
            | grep -A 1 -E 'TradeStreamProjector|Unhandled exception|Fatal' || echo "(no matching lines)"
          echo "::endgroup::"
          echo "::group::market-data-aggregator closed bars only"
          docker compose -f "$COMPOSE_FILE" logs market-data-aggregator 2>&1 \
            | grep -A 1 -E 'OhlcAggregationMiddleware|Unhandled exception|Fatal' || echo "(no matching lines)"
          echo "::endgroup::"

      - name: Compose down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v || true

name: Smoke - Real-Time Risk (.NET)

# End-to-end smoke test for the whole .NET slice: build the images, `docker compose up`, book
# trades, assert the read model eventually reflects them, exercise all three of the Pricing Service's
# gRPC shapes, and run an end-of-day risk map-reduce across a worker pool. Fully self-contained
# (DynamoDB Local, no cloud credentials or account needed).
on:
  push:
    branches: [ "main" ]
    paths:
      - 'real-time-risk/dotnet/**'
      - '.github/workflows/smoke-real-time-risk-dotnet.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'real-time-risk/dotnet/**'
      - '.github/workflows/smoke-real-time-risk-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: real-time-risk/dotnet/docker-compose.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install grpcurl
        # The Pricing Service is gRPC, so curl cannot drive it. grpcurl needs no .proto file because
        # the service has server reflection on - the same one-command reachability the README promises
        # a reader, asserted here rather than assumed.
        run: |
          curl -fsSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin grpcurl
          grpcurl --version

      - name: Compose up (build)
        # Retried because the build's `dotnet restore` runs inside a fresh container with no NuGet
        # cache, so it goes straight to nuget.org's CDN - and that has twice served this job a
        # STALE version index: runs on 2026-08-14 failed with NU1102 "Unable to find package
        # <id> with version (= 0.0.2-alpha.4)" reporting a truncated version list whose nearest
        # match was an old four-part version (0.0.2.12-alpha / 0.0.2.13-alpha), i.e. an index with
        # none of the 0.0.2-alpha.* versions in it at all. Every pinned package does have
        # 0.0.2-alpha.4 published (since 2026-08-10), the identical commit passed on 2026-08-10
        # and 2026-08-11, and each failure named a *different* package - so this is registry-side
        # staleness, not a bad pin. Retry so a CDN hiccup doesn't red the branch; a genuine
        # unsatisfiable pin still fails all three attempts and reports the same NU1102.
        run: |
          for attempt in 1 2 3; do
            # --scale risk-worker=3: the coordinator routes to ONE url and Compose's DNS
            # round-robins it across the replicas, so this asserts the fan-out really is a pool
            # rather than a single container answering three times.
            if docker compose -f "$COMPOSE_FILE" up -d --build --scale risk-worker=3; then
              exit 0
            fi
            echo "::warning::compose build failed (attempt $attempt/3); retrying in 30s"
            docker compose -f "$COMPOSE_FILE" down -v || true
            sleep 30
          done
          echo "::error::compose build failed after 3 attempts"
          exit 1

      - name: Wait for both services to accept requests
        # "Up" here just means curl gets any HTTP response instead of connection-refused (status
        # "000") - neither service has a dedicated health endpoint yet, and TradeLedger has no GET
        # route at all (only POST /trades), so a 4xx/5xx still proves the app is listening.
        run: |
          for url in http://localhost:8081/trades http://localhost:8082/books/warmup/positions; do
            ok=0
            for i in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              if [ "$status" != "000" ]; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url never came up"
              exit 1
            fi
          done

      - name: Wait for the Pricing Service to report SERVING
        # Unlike the other two, this service HAS a real health check (grpc.health.v1, bridged from
        # Benzene's own), so this waits on a genuine readiness signal rather than on "something
        # answered". That is also the assertion that reflection and the interceptor are both wired:
        # a reachable port with a broken pipeline would still fail here.
        run: |
          ok=0
          for i in $(seq 1 30); do
            if grpcurl -plaintext -d '{}' localhost:8083 grpc.health.v1.Health/Check 2>/dev/null \
                | jq -e '.status == "SERVING"' >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::pricing service never reported SERVING"
            docker compose -f "$COMPOSE_FILE" logs pricing || true
            exit 1
          fi
          echo "--- reflection lists ---"
          grpcurl -plaintext localhost:8083 list

      - name: Book a trade
        run: |
          curl -fsS -X POST http://localhost:8081/trades \
            -H 'content-type: application/json' \
            -d '{"book":"smoke-test","symbol":"AAPL","side":"Buy","quantity":100,"price":150.25}' \
            -o book-trade-response.json
          echo "--- book-trade-response.json ---"; cat book-trade-response.json
          # A plain [HttpEndpoint] response body is the handler's raw JSON payload (camelCase) - no
          # BenzeneMessage envelope wrapper; the Benzene status maps onto the HTTP status instead.
          jq -e '.version == 1' book-trade-response.json >/dev/null \
            || { echo "::error::expected the first trade on a fresh book to be version 1"; exit 1; }

      # The projection is eventually consistent (DynamoDB Streams -> the background poller), so poll
      # until it catches up rather than asserting on the first read. 90 attempts (~3 minutes) rather
      # than the original 30 (~1 minute): a real run showed the projector's own stream-discovery loop
      # (TradeStreamProjector.WaitForStreamArnAsync, 2s interval) plus its first GetRecords poll can
      # take close to a minute on a loaded CI runner even though every step it's built from is fast in
      # isolation - the projection landed correctly (right trade, right version) just a few seconds
      # after the old 60s budget ran out, so this was headroom, not a logic bug.
      - name: Assert the read model reflects the booked trade
        run: |
          ok=0
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8082/books/smoke-test/positions -o positions.json
            projected=$(jq -r '.projectedThroughVersion' positions.json)
            echo "attempt $i: projectedThroughVersion=$projected"
            if [ "$projected" = "1" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::read model never projected the booked trade"
            cat positions.json
            exit 1
          fi
          echo "--- positions.json ---"; cat positions.json
          jq -e '.positions[] | select(.symbol == "AAPL" and .netQuantity == 100)' positions.json >/dev/null \
            || { echo "::error::expected a 100-share AAPL position"; exit 1; }

      - name: Assert all three gRPC shapes (unary, server-streaming, bidirectional)
        run: |
          set -euo pipefail

          echo "::group::unary - GetPrice"
          grpcurl -plaintext -d '{"symbol":"AAPL"}' localhost:8083 pricing.Pricing/GetPrice \
            > price.json
          cat price.json
          jq -e '.symbol == "AAPL" and .mid > 0 and .bid < .mid and .ask > .mid' price.json >/dev/null \
            || { echo "::error::GetPrice did not return a sane two-sided quote"; exit 1; }
          # Greeks for a notional at-the-money 30-day call: delta near 0.5, gamma and vega positive,
          # theta negative. Asserting the SIGNS and the rough magnitude catches a feed wired to the
          # wrong formula, which a "greeks block is present" check would happily pass.
          jq -e '.greeks | .delta > 0.4 and .delta < 0.65 and .gamma > 0 and .vega > 0 and .theta < 0' \
            price.json >/dev/null \
            || { echo "::error::greeks are not those of an ATM call"; exit 1; }
          echo "::endgroup::"

          echo "::group::unary - unknown symbol maps to NotFound"
          # The result-status mapping the reference doc calls out: the handler returns a Benzene
          # NotFound and knows nothing about gRPC; Benzene turns it into StatusCode.NotFound.
          if grpcurl -plaintext -d '{"symbol":"NOT-A-SYMBOL"}' localhost:8083 pricing.Pricing/GetPrice \
              > notfound.txt 2>&1; then
            echo "::error::an unknown symbol should not have succeeded"; cat notfound.txt; exit 1
          fi
          cat notfound.txt
          grep -q 'NotFound' notfound.txt \
            || { echo "::error::expected a NotFound status"; exit 1; }
          echo "::endgroup::"

          echo "::group::server-streaming - SubscribePrices"
          # max_ticks makes the stream finite, so this asserts on a count rather than racing a
          # deadline. Sequence numbers must be contiguous from 0 - a consumer spots a gap that way.
          grpcurl -plaintext -d '{"symbol":"MSFT","max_ticks":3}' localhost:8083 \
            pricing.Pricing/SubscribePrices > ticks.json
          cat ticks.json
          count=$(jq -s 'length' ticks.json)
          [ "$count" = "3" ] || { echo "::error::expected 3 ticks, got $count"; exit 1; }
          jq -se '[.[] | .sequence // "0" | tonumber] == [0,1,2]' ticks.json >/dev/null \
            || { echo "::error::expected contiguous sequence numbers 0,1,2"; exit 1; }
          echo "::endgroup::"

          echo "::group::bidirectional - PriceStream"
          # Two watches then half-close. Every watch is answered with an immediate snapshot, so the
          # tick count is a function of what was asked for rather than of how long the session
          # happened to stay open - deterministic without a sleep.
          printf '{"symbol":"AAPL"}\n{"symbol":"TSLA"}\n' \
            | grpcurl -plaintext -d @ localhost:8083 pricing.Pricing/PriceStream > session.json
          cat session.json
          jq -se '[.[] | .symbol] | (index("AAPL") != null) and (index("TSLA") != null)' session.json >/dev/null \
            || { echo "::error::expected an immediate tick for each watched symbol"; exit 1; }
          echo "::endgroup::"

          echo "::group::bidirectional - an unknown symbol does not kill the session"
          printf '{"symbol":"NOT-A-SYMBOL"}\n{"symbol":"GOOG"}\n' \
            | grpcurl -plaintext -d @ localhost:8083 pricing.Pricing/PriceStream > mixed.json
          cat mixed.json
          jq -se '[.[] | .symbol] == ["GOOG"]' mixed.json >/dev/null \
            || { echo "::error::expected GOOG only, with the unknown symbol ignored"; exit 1; }
          echo "::endgroup::"

      - name: Assert the end-of-day risk map-reduce
        run: |
          set -euo pipefail

          # A second book, so the scatter genuinely fans out across more than one shard, and a
          # position in a symbol the price feed does not cover, so the run has something to be
          # honest about.
          curl -fsS -X POST http://localhost:8081/trades -H 'content-type: application/json' \
            -d '{"book":"risk-b","symbol":"MSFT","side":"Sell","quantity":50,"price":402.10}' -o /dev/null
          curl -fsS -X POST http://localhost:8081/trades -H 'content-type: application/json' \
            -d '{"book":"risk-b","symbol":"NOT-A-SYMBOL","side":"Buy","quantity":7,"price":1.00}' -o /dev/null

          # Both books must reach the projection before the run, or the risk number is computed over
          # a read model that has not caught up - which would be a racy test rather than a wrong
          # product. The run itself is correct either way; only the assertion needs the wait.
          for book in smoke-test risk-b; do
            ok=0
            for i in $(seq 1 90); do
              curl -fsS "http://localhost:8082/books/$book/positions" -o "positions-$book.json"
              if [ "$(jq -r '.positions | length' "positions-$book.json")" -gt 0 ]; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = "1" ] || { echo "::error::$book never projected"; cat "positions-$book.json"; exit 1; }
          done

          echo "::group::risk run"
          curl -fsS -X POST http://localhost:8084/risk/runs \
            -H 'content-type: application/json' \
            -d '{"books":["smoke-test","risk-b"],"shardSize":1}' -o risk.json
          cat risk.json
          echo "::endgroup::"

          # The scatter fanned out over both books.
          jq -e '.shardCount == 2' risk.json >/dev/null \
            || { echo "::error::expected 2 shards"; exit 1; }
          # Every shard came back, so the total covers the whole run.
          jq -e '.isComplete == true and (.failedShards | length) == 0' risk.json >/dev/null \
            || { echo "::error::a shard failed"; exit 1; }
          # AAPL and MSFT priced; the unknown symbol NOT valued, and NAMED rather than silently
          # treated as worth zero. This is the assertion the whole partial-coverage design is for.
          jq -e '.positionsValued == 2' risk.json >/dev/null \
            || { echo "::error::expected 2 priced positions"; exit 1; }
          jq -e '.isFullyPriced == false and (.unpricedSymbols | index("NOT-A-SYMBOL") != null)' risk.json >/dev/null \
            || { echo "::error::an unpriceable position must be reported, not valued at zero"; exit 1; }
          # The two kinds of incompleteness are independent: this run is COMPLETE (no shard failed)
          # and NOT FULLY PRICED. Collapsing them into one flag would lose exactly that distinction.
          jq -e '.isComplete == true and .isFullyPriced == false' risk.json >/dev/null \
            || { echo "::error::shard coverage and price coverage must report separately"; exit 1; }
          # 100 AAPL long plus 50 MSFT short is a net short book at these prices, and the total is
          # market value plus realized cash - asserted as a relation rather than a magic number,
          # since the feed's marks move.
          jq -e '(.totalValue - (.marketValue + .realizedCash)) | fabs < 0.01' risk.json >/dev/null \
            || { echo "::error::totalValue must be marketValue + realizedCash"; exit 1; }

          echo "::group::an empty book list is rejected, not answered with zero"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8084/risk/runs \
            -H 'content-type: application/json' -d '{"books":[]}')
          echo "HTTP $code"
          [ "$code" = "422" ] || { echo "::error::expected 422, got $code"; exit 1; }
          echo "::endgroup::"

      - name: Dump logs on failure
        if: failure()
        # No --tail limit, and one service at a time: risk-read-models alone emits 2 log lines per
        # /positions poll (up to 90 of them), which was drowning out TradeStreamProjector's own
        # startup/lifecycle lines under a shared --tail=200 - the exact lines needed to diagnose a
        # failed projection were being truncated away before they ever reached this step's output.
        run: |
          docker compose -f "$COMPOSE_FILE" ps -a || true
          for service in dynamodb-local trade-ledger risk-read-models pricing risk-worker risk-coordinator; do
            echo "::group::$service full logs"
            docker compose -f "$COMPOSE_FILE" logs "$service" || true
            echo "::endgroup::"
          done
          echo "::group::risk-read-models TradeStreamProjector lines only"
          # -A 1: the .NET console logger puts the category on one line ("info: ...TradeStreamProjector[0]")
          # and the actual message on the next, indented line - without -A 1 this only ever showed the
          # category, never the message that explains what happened.
          docker compose -f "$COMPOSE_FILE" logs risk-read-models 2>&1 \
            | grep -A 1 -E 'TradeStreamProjector|Unhandled exception|Fatal' || echo "(no matching lines)"
          echo "::endgroup::"

      - name: Compose down
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v || true
